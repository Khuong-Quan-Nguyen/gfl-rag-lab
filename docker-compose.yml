services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gfl-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: gfl
    ports:
      - "5433:5432"          # host 5433 avoids clashing with a local Postgres on 5432
    shm_size: 1gb            # Docker's default 64 MB /dev/shm is too small for parallel index builds
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # schema.sql runs on first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d gfl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
